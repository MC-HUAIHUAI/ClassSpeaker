name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  test:
    name: 测试 (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, bits: 64 }
          - { arch: x86, bits: 32 }

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 确认解释器位数
        run: python -c "import struct;print('bits =', struct.calcsize('P') * 8)"

      - name: 后端接口测试
        run: python tools/smoke_test.py

      - name: 界面测试（offscreen）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/gui_test.py

      - name: Class Widgets 插件测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/plugin_test.py

      - name: 编译检查
        run: python -m compileall -q .
